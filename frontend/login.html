<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groovon - Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #0f0f1a;
    border: 1px solid #1e1e2e;
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .logo-wrap { width: 220px; height: 66px; margin: 0 auto 32px; }
  .subtitle { color: #555; font-size: 13px; margin-top: -20px; margin-bottom: 32px; }
  .field { margin-bottom: 16px; text-align: left; }
  .field label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .field input {
    width: 100%;
    background: #1a1a2a;
    border: 1px solid #2a2a3e;
    border-radius: 8px;
    padding: 12px 14px;
    color: #e0e0e0;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: #1db954; }
  .btn {
    width: 100%;
    background: #1db954;
    color: #000;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
  }
  .btn:hover { background: #1ed760; }
  .error { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <object data="logo.svg" type="image/svg+xml" style="width:100%;height:100%;"></object>
  </div>
  <p class="subtitle">Artist Intelligence Platform</p>
  <div class="field">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
  </div>
  <button class="btn" onclick="login()">Sign In</button>
  <p class="error" id="error">Invalid username or password</p>
</div>

<script>
// Simple demo credentials
const USERS = { "groovon": "demo2025", "admin": "groovon123" };

document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

function login() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (USERS[u] && USERS[u] === p) {
    sessionStorage.setItem('groovon_auth', u);
    const next = new URLSearchParams(location.search).get('next') || 'index.html';
    location.href = next;
  } else {
    document.getElementById('error').style.display = 'block';
  }
}

// Already logged in?
if (sessionStorage.getItem('groovon_auth')) location.href = 'index.html';
</script>
</body>
</html>

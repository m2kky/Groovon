services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: groovon
      POSTGRES_USER: groovon
      POSTGRES_PASSWORD: groovon
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      - db
    expose:
      - "8000"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.groovon-api.rule=Host(`groovon.muhammedmekky.com`) && PathPrefix(`/api`)"
      - "traefik.http.middlewares.groovon-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.groovon-api.middlewares=groovon-strip"
      - "traefik.http.services.groovon-api.loadbalancer.server.port=8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.groovon-frontend.rule=Host(`groovon.muhammedmekky.com`)"
      - "traefik.http.services.groovon-frontend.loadbalancer.server.port=80"

volumes:
  pgdata:
